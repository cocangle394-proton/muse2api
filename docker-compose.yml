version: '3.8'

services:
  muse2api:
    build: .
    image: muse2api:latest
    container_name: muse2api
    restart: always
    ports:
      - "18610:18610"
    environment:
      # Admin and API auth key (read from .env or the host environment; auto-generated if empty)
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      # Service public base URL, e.g. https://your-domain.com (empty means the admin frontend auto-detects the current domain)
      - MUSE2API_PUBLIC_BASE=
      # Timeout settings (seconds)
      - MUSE2API_IMAGE_TIMEOUT=240
      - MUSE2API_VIDEO_TIMEOUT=600
      - MUSE2API_CHAT_TIMEOUT=300
    volumes:
      # Persist account config, task logs, and media files
      - ./data:/app/data
    shm_size: '2gb' # Keeps Chromium from crashing on /dev/shm exhaustion when rendering many tabs
