# ==========================================
# MUSE2API Nginx reverse proxy config example
# ==========================================
# Works with the BT Panel / 1Panel / standalone Nginx
# Key points: raise proxy_read_timeout and turn off proxy_buffering so SSE streaming output works
# ==========================================

server {
    listen 80;
    server_name your-domain.com; # Replace with your own domain or IP

    # Allow uploading reference images (image-to-image / image editing support large multimodal images)
    client_max_body_size 200M;   # A single video/audio reference item is at most 40 MiB; JSON Base64 inflates it by about another 1/3

    location / {
        proxy_pass http://127.0.0.1:18610;

        # Key point: image and video generation take 30-120 seconds; the default 60s makes Nginx return 502 Bad Gateway
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # Key point: turn buffering off so /v1/chat/completions SSE streams with zero-delay typewriter output
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket compatibility
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
